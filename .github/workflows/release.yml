name: Release

on:
  workflow_dispatch:

permissions: {}

env:
  IMAGE_ARCHIVE: discord-redmine-bridge-linux-amd64.tar.gz

defaults:
  run:
    shell: bash

jobs:
  reject-non-main:
    name: Require main for releases
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Report invalid release branch
        run: |
          echo "::error::Run the release workflow from the main branch."
          exit 1

  checks:
    name: Check the release commit
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  image:
    name: Build and push image
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      name: ${{ steps.metadata.outputs.image }}
      tag: ${{ steps.metadata.outputs.tag }}
      digest: ${{ steps.build.outputs.digest }}
      archive-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set image name and tag
        id: metadata
        run: |
          timestamp=$(date -u +%Y%m%dT%H%M%SZ)
          {
            printf 'image=ghcr.io/%s\n' "${GITHUB_REPOSITORY,,}"
            printf 'tag=v%s-%s-%s\n' "$timestamp" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.metadata.outputs.image }}:${{ steps.metadata.outputs.tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Record published image
        env:
          IMAGE: ${{ steps.metadata.outputs.image }}
          RELEASE_TAG: ${{ steps.metadata.outputs.tag }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            printf 'Pushed %s:%s from commit %s.\n\n' "$IMAGE" "$RELEASE_TAG" "$GITHUB_SHA"
            printf '    docker pull %s@%s\n' "$IMAGE" "$DIGEST"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Save the published image
        env:
          IMAGE: ${{ steps.metadata.outputs.image }}
          RELEASE_TAG: ${{ steps.metadata.outputs.tag }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          docker image pull --platform linux/amd64 "$IMAGE@$DIGEST"
          docker image tag "$IMAGE@$DIGEST" "$IMAGE:$RELEASE_TAG"
          docker image save "$IMAGE:$RELEASE_TAG" | gzip > "$RUNNER_TEMP/$IMAGE_ARCHIVE"

      - name: Upload image archive
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-${{ steps.metadata.outputs.tag }}
          path: ${{ runner.temp }}/${{ env.IMAGE_ARCHIVE }}
          if-no-files-found: error
          compression-level: 0

  release:
    name: Create release draft
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download image archive
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.image.outputs.archive-id }}
          path: ${{ runner.temp }}

      - name: Create draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ${{ needs.image.outputs.name }}
          RELEASE_TAG: ${{ needs.image.outputs.tag }}
          DIGEST: ${{ needs.image.outputs.digest }}
        run: |
          : "${IMAGE:?Missing image name}" "${RELEASE_TAG:?Missing release tag}" "${DIGEST:?Missing image digest}"
          archive="$RUNNER_TEMP/$IMAGE_ARCHIVE"
          test -s "$archive"
          notes_file="$RUNNER_TEMP/release-notes.md"
          {
            printf 'Built from commit %s for Linux amd64.\n\n' "$GITHUB_SHA"
            printf 'Download %s from Assets and load it into Docker.\n\n' "$IMAGE_ARCHIVE"
            printf '    docker load --input %s\n\n' "$IMAGE_ARCHIVE"
            printf 'Image %s:%s\n\n' "$IMAGE" "$RELEASE_TAG"
            printf 'Users with GHCR access can also pull by digest.\n\n'
            printf '    docker pull %s@%s\n' "$IMAGE" "$DIGEST"
          } > "$notes_file"

          gh release create "$RELEASE_TAG" "$archive" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TAG" \
            --draft \
            --generate-notes \
            --notes-file "$notes_file"
